name: docs

# Release tags trigger a rebuild as well as pushes to `main`, so the published site is never one
# commit behind a release when `main` has not moved since the last doc-affecting change.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Deployment goes through GitHub's native Pages pipeline rather than a force-push to a
# `gh-pages` branch, so the repository's Pages source must be set to "GitHub Actions"
# (Settings > Pages > Build and deployment). `id-token: write` is what lets `deploy-pages`
# authenticate over OIDC; `contents` drops to read because nothing pushes a branch any more.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued run waits for the one in flight rather than cancelling it, so a deploy is never
# interrupted half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version, unlike every other action here: astral-sh stopped
      # publishing moving major tags after `v7`, so `@v10` does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group docs

      # `--strict` is the gate: it exits 1 on a dangling `[`name`][triwarp.old.path]`
      # cross-reference, which is the mechanical backstop for the five artifacts a moved or
      # renamed public function has to take with it (.claude/CLAUDE.md §4.4).
      - name: Build docs
        run: uv run zensical build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy docs
        id: deployment
        uses: actions/deploy-pages@v5
