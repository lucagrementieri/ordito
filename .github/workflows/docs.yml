name: docs

# Release tags trigger a rebuild as well as pushes to `main`, so the published site is never one
# commit behind a release when `main` has not moved since the last doc-affecting change.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

# Versioned docs go through Zensical's fork of mike, which commits each version into its own
# directory of the `gh-pages` branch and pushes it. The repository's Pages source must therefore
# be "Deploy from a branch", branch `gh-pages`, folder `/ (root)` (Settings > Pages > Build and
# deployment), and `contents: write` is what lets the job push that branch.
permissions:
  contents: write

# A queued run waits for the one in flight rather than cancelling it, so two runs never race on a
# push to `gh-pages`.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # mike commits on top of the existing `gh-pages` branch, so the clone needs it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned to an exact version, unlike every other action here: astral-sh stopped
      # publishing moving major tags after `v7`, so `@v10` does not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group docs

      # `--strict` is the gate: it exits 1 on a dangling `[`name`][ordito.old.path]`
      # cross-reference, which is the mechanical backstop for the five artifacts a moved or
      # renamed public function has to take with it (.claude/CLAUDE.md §4.4). mike's own build
      # below runs `zensical build --clean` without `--strict`, so this step is what fails the run.
      - name: Check docs
        run: uv run zensical build --strict

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # `stable` is the only version for now. Once releases get their own versions, deploy
      # `${GITHUB_REF_NAME#v}` with `--update-aliases ... stable` on tags and keep `main` as `dev`.
      - name: Deploy docs
        run: |
          uv run mike deploy --push stable
          uv run mike set-default --push --allow-empty stable
