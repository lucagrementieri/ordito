name: test

on:
  push:
    branches:
      - main
  pull_request:

# A superseded run on the same branch is cancelled; `main` is exempt so a push that triggers a
# release is never half-verified.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The four cheap gates. These mirror `.claude/CLAUDE.md` section 8's local "done" list exactly,
  # so a green CI means the same thing a green local run does. They are separate jobs rather
  # than steps of one so a formatting failure still reports the type-check result.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact version, unlike every other action here: astral-sh stopped
      # publishing moving major tags after `v7`, so `@v10` does not resolve.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv python install
      # `dev` carries ruff; nothing else is imported to lint.
      - run: uv sync --group dev
      - name: ruff format
        run: uv run ruff format --check triwarp tests benchmarks
      - name: ruff check
        run: uv run ruff check triwarp tests benchmarks

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv python install
      # `--extra io` is load-bearing, not tidiness: `triwarp/io.py` imports `meshio` under
      # `if TYPE_CHECKING:`, which basedpyright resolves even though the runtime import is lazy.
      # Without it the gate reports a spurious `reportMissingImports` and fails green-looking
      # code -- the failure mode section 8 already warns about for a dev-only environment.
      - run: uv sync --group dev --extra io
      # basedpyright reads `venv = ".venv"` / `venvPath = "."` from pyproject.toml, which is
      # where `uv sync` puts the environment, so no interpreter flag is needed here.
      #
      # The explicit `triwarp` path is load-bearing: `include` in pyproject.toml also covers
      # `tests` and `benchmarks`, and checking those needs all nine reference libraries of
      # section 7.6 resolvable -- which is the disk reclaim, the apt install and the from-source
      # pytorch3d build that `pytest-cpu` below spends minutes on. An explicit path overrides
      # `include`, so this job stays seconds long and still gates the shipped package. The wide
      # gate runs in `pytest-cpu`, where that environment already exists.
      - name: basedpyright (shipped package)
        run: uv run basedpyright triwarp

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --group docs
      # The mechanical backstop for the five artifacts a moved or renamed public function has to
      # take with it (section 4.4): `--strict` exits 1 on a dangling `[name][triwarp.old.path]`.
      - name: Build docs
        run: uv run zensical build --strict

  # ---------------------------------------------------------------------------
  # The packaging gate, across every Python the classifiers claim.
  #
  # This is the one thing a `uv sync --all-groups` environment never exercises: an end user
  # installs a wheel into a bare interpreter with no CUDA, no reference libraries and no dev
  # tooling. `import triwarp` has been found to regress in exactly that configuration before
  # (section 16.2 -- the lazy `__init__` guard runs `import triwarp` in a subprocess for the
  # same reason), so it is checked on every push rather than only at release time.
  # ---------------------------------------------------------------------------
  wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Build the wheel and sdist
        run: uv build
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the wheel into a bare interpreter
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
      # No CUDA on a GitHub runner, so this is the CPU backend by construction. The assertions
      # are deliberately minimal -- one allocation, one kernel launch, one derived quantity --
      # because the real regression suite is the `pytest-cpu` job below; this one is about the
      # wheel, not the geometry.
      - name: Smoke-test the installed wheel
        run: |
          /tmp/smoke/bin/python -c "
          import triwarp as tw
          # Reads the installed distribution metadata, so it can only be checked from a real
          # install -- in a source tree it falls back to a sentinel.
          assert tw.__version__ != '0.0.0+unknown', tw.__version__
          vertices, faces = tw.creation.icosphere(subdivisions=2)
          assert faces.shape[0] == 960, faces.shape
          mesh = tw.Trimesh(vertices, faces)
          assert mesh.is_watertight
          assert mesh.euler_characteristic == 2
          print('ok: triwarp', tw.__version__, '--', vertices.shape[0], 'vertices on', vertices.device)
          "
      - name: Check py.typed shipped
        run: unzip -l dist/*.whl | grep -q 'triwarp/py.typed'

  # ---------------------------------------------------------------------------
  # The CPU regression suite.
  #
  # Runs on 3.11 alone, not the full classifier matrix: the reference stack this needs is nine
  # libraries deep and includes pytorch3d compiled from source, so matrixing it would pay that
  # build once per interpreter to re-run device-independent geometry assertions. Per-interpreter
  # coverage is the `wheel` job above; this job is about the library's answers, which do not vary
  # by Python version.
  #
  # This does NOT replace the GPU-side discipline in section 7.2 -- the two-process
  # `python -m tests.devices` runner and the full nine-reference parity suite still run on the
  # maintainer's CUDA box before a tag (see `.github/RELEASING.md`). CI's job is to catch a
  # CPU-only regression on every PR.
  # ---------------------------------------------------------------------------
  pytest-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The reference stack is large (a CUDA torch wheel, Open3D, PyMeshLab, MeshLib) and the
      # runner image ships ~14 GB of tooling this job never touches.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      # pymeshlab registers each filter from a `libfilter_*.so` it dlopens at import, and a plugin
      # whose dependencies are missing is skipped **silently** -- no warning, no exception, the
      # filter simply is not an attribute of `MeshSet`. That cost a full CI run to diagnose: 19
      # tests failed with `'MeshSet' object has no attribute 'meshing_close_holes'` and friends,
      # while `import pymeshlab` and 49 of the 58 plugins worked fine.
      #
      # All eight missing filters live in `libfilter_meshing.so`, and what singles that plugin out
      # is `libGLU.so.1`: only 9 of the 58 need it, where all 58 need `libGL.so.1` and most
      # loaded. So the one package actually absent from the runner image is `libglu1-mesa`.
      # `libgl1` is listed too because every plugin needs it -- it happens to be present today,
      # and naming it means a future runner image that drops it fails here with an apt error
      # rather than as nineteen mystifying AttributeErrors.
      - name: Install the reference stack's system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libglu1-mesa libgl1

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv python install

      # The documented two-step install, and both steps are required. pytorch3d's `setup.py`
      # imports torch at build time to locate its headers and pick the CPU or CUDA extension, so
      # it is built with `no-build-isolation` and torch has to already be present. uv keys the
      # built wheel on the resolved git commit, so a warm `~/.cache/uv` makes the second step
      # near-instant and the ~90 s compile is paid once per pin bump.
      #
      # No CUDA toolkit is installed here, so pytorch3d builds its CPU-only extension. That is
      # correct for this job: `benchmarks/conftest.py` gates the `pytorch3d-cuda` row on actually
      # launching a kernel, and the CPU rows are what a CPU test run compares against anyway.
      - name: Install dependencies (torch first, then build pytorch3d against it)
        run: |
          uv sync --all-groups --no-install-package pytorch3d
          uv sync --all-groups

      # The guard for the failure mode above, and the reason it is a step rather than a comment:
      # a skipped plugin is invisible until a test reaches one of its filters, so without this the
      # symptom is an `AttributeError` several hundred tests into a 7-minute run. One filter from
      # `libfilter_meshing.so` is enough -- it is the plugin with the extra `libGLU` dependency,
      # so it is the first to go -- and the check costs about a second.
      - name: Verify pymeshlab's filter plugins loaded
        run: |
          uv run python -c "
          import pymeshlab
          probes = ('meshing_close_holes', 'compute_selection_crease_per_edge')
          meshset = pymeshlab.MeshSet()
          missing = [name for name in probes if not hasattr(meshset, name)]
          if missing:
              raise SystemExit(
                  f'pymeshlab filter plugins did not load: {missing}. A libfilter_*.so is '
                  'missing a system library -- check libGLU.so.1 / libGL.so.1.'
              )
          print('pymeshlab filter plugins loaded')
          "

      # `--device=cpu` rather than `--device=both`: there is no CUDA here, so `both` would only
      # add the `slow_cpu`-marked tests, which are ~280 s of screened-Poisson solves whose claim
      # is device-independent and already covered on the maintainer's box.
      #
      # Coverage rides along on this one run rather than getting a job of its own -- the suite is
      # the expensive part and instrumenting it costs a few percent, where a second job would pay
      # for the whole nine-library reference install again.
      #
      # Two things this number is not, both worth knowing before reading the badge:
      #
      #   * It is not kernel coverage. `triwarp/kernels/` is omitted in `pyproject.toml`'s
      #     `[tool.coverage.run]`, because a `@wp.kernel` body executes on the device and never
      #     under coverage.py's tracer -- measured at 35 % for a kernel module whose every line
      #     ran on all 53 of its tests. The gate is over the Python wrapper layer, which is where
      #     the dispatch, validation and shape logic actually lives.
      #   * It is not CUDA coverage. There is no GPU on a runner, so every `device.is_cuda`
      #     branch and the tiled-reduction paths behind `_device.prefers_tiled_reduction` are
      #     unreachable here. Those are covered by the maintainer's two-process
      #     `python -m tests.devices` run before a tag (see `.github/RELEASING.md`).
      #
      # Coverage is reported here but NOT gated here -- the floor is a separate step below, after
      # the badge has been published. Ordering matters: if the threshold failed this step, a real
      # coverage regression on `main` would abort before the badge updated, leaving it frozen at
      # the last good number. A badge that silently stops moving is worse than one showing a drop.
      - name: pytest (CPU device, with coverage)
        run: >
          uv run pytest --device=cpu -q
          --cov=triwarp
          --cov-report=term
          --cov-report=json

      # `percent_covered_display` already honours `precision = 2` from pyproject.toml, so the
      # badge reads the same figure the terminal report printed.
      - name: Read the coverage percentage
        id: coverage
        run: |
          set -euo pipefail
          pct=$(uv run python -c "
          import json
          print(json.load(open('coverage.json'))['totals']['percent_covered_display'])
          ")
          # An empty value here would publish a blank badge rather than fail, so refuse it.
          test -n "$pct"
          echo "percent=$pct" >> "$GITHUB_OUTPUT"
          echo "Total coverage: $pct%"

      # The badge, written to a Gist that shields.io renders through its `endpoint` API. Free, and
      # nothing leaves GitHub.
      #
      # Setup, once: create a secret Gist containing a file named `triwarp-coverage.json` (any
      # placeholder content), put its id in `gistID` below, then create a personal access token
      # with the single `gist` scope and add it as the `GIST_TOKEN` repository secret.
      #
      # `main` pushes only. A pull request must not move the published badge -- it reports the
      # branch, not the shipped state -- and a fork PR cannot read the secret anyway, so without
      # this condition every outside contribution would fail the job on a missing token.
      #
      # The colour is interpolated across `minColorRange`..`maxColorRange`; the window is set
      # around the real measurement rather than 0..100, or every plausible result paints the same
      # green and the colour carries no information.
      - name: Publish the coverage badge
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 208b2ea8a3b764ca7c10d82195533738
          filename: triwarp-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percent }}%
          valColorRange: ${{ steps.coverage.outputs.percent }}
          minColorRange: 88
          maxColorRange: 97

      # The gate, and the last thing in the job so the badge is already published when it fires.
      #
      # It is a ratchet, not a target: the measured figure on this configuration is **93.79 %** --
      # 11 403 statements with 454 missed and 3 320 branch exits with 460 missed, over 3 397
      # passed / 28 skipped -- so a floor of 90 leaves 3.79 points, roughly 558 statements, of
      # slack. Deliberately loose, because a gate that trips on an honest work-in-progress module
      # is a gate someone switches off. Raise it when the headroom gets wide; do not lower it
      # without saying why in the commit.
      #
      # `coverage report` re-reads the `.coverage` pytest-cov just wrote and the same
      # `[tool.coverage.report]` settings, so this cannot disagree with the number above.
      # The wide half of the type gate, and it sits here for the same reason the coverage floor
      # does: `include` covers `tests` and `benchmarks`, and this is the only job whose
      # environment resolves every reference library -- but failing it earlier would abort the
      # job before the badge published, freezing the badge exactly as a coverage regression
      # would. The `typecheck` job already gated `triwarp/` on its own, seconds after push.
      - name: basedpyright (tests and benchmarks)
        run: uv run basedpyright

      - name: Enforce the coverage floor
        run: uv run coverage report --fail-under=90
