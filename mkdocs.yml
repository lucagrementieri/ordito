site_name: ordito
site_description: >-
  GPU-first triangle mesh processing: geometry, topology, repair, remeshing, geodesics
  and reconstruction on NVIDIA Warp.
site_url: https://lucagrementieri.github.io/ordito/
repo_url: https://github.com/lucagrementieri/ordito
docs_dir: docs

# Read by Zensical (`zensical build` / `zensical serve`), not by MkDocs -- Zensical consumes
# `mkdocs.yml` as-is, so the filename and every key below are unchanged. Build the site with
# `--strict`, which is what fails on a dangling `[`name`][ordito.old.path]` cross-reference.
#
# The API pages come from Zensical's native `api-autonav` (one page per public module, at
# `api/ordito/<module>/`); the nav, including the themed shelving of those pages, is the committed
# `docs/SUMMARY.md`. A plain `zensical build` / `serve` needs no pre-build step.
#
# Zensical has no whole-file exclusion setting, so a generated page that should stay out of the
# search index says so in its own front matter (`search: exclude: true`): the per-module pages
# under `benchmarks/`, written by `benchmarks/tools/render_docs.py`.

theme:
  name: material
  custom_dir: docs/.overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Versioned docs through Zensical's fork of mike: each version lives in its own directory of the
# `gh-pages` branch and the root redirects to the `default` alias. A release tag deploys its
# `<x.y>` version under the `stable` alias, and `main` deploys `dev` (`.github/workflows/docs.yml`).
extra:
  version:
    provider: mike
    default: stable

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  # Click-to-zoom on images: the example figures are rendered wider than the content column.
  - glightbox
  # `ordito` itself is excluded: its docstring is about the lazy-import mechanism, not a page for
  # a caller. Private `_*.py` modules are excluded by the plugin's default.
  - api-autonav:
      modules: [ordito]
      exclude: [ordito.kernels, "re:^ordito$"]
      api_root_uri: api
      # `ordito.typing`'s aliases are linked from every return annotation (85 referrers for
      # `Array2dInt32`), so a "Referenced by" block there lists signatures, not uses.
      module_options:
        "ordito\\.typing":
          backlinks: false
  - mkdocstrings:
      # `backlinks.html.jinja` here replaces the stock breadcrumb tree with one collapsed line.
      custom_templates: docs/.overrides/mkdocstrings
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.scipy.org/doc/scipy/objects.inv
            - https://trimesh.org/objects.inv
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_if_no_docstring: true
            members_order: source
            # "Referenced by": every docstring that cross-links an object, grouped by nav path.
            # It is the consumer list a hub function's See Also deliberately does not carry.
            backlinks: tree
            # A table of the module's functions and classes, each with its summary line, opens
            # every API page -- the index trimesh's and libigl's references open with.
            summary:
              classes: true
              functions: true
              attributes: false
              modules: false
