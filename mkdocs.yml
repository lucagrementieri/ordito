site_name: ordito
site_description: Triangular mesh library based on NVIDIA Warp
site_url: https://lucagrementieri.github.io/ordito/
repo_url: https://github.com/lucagrementieri/ordito
docs_dir: docs

# Read by Zensical (`zensical build` / `zensical serve`), not by MkDocs -- Zensical consumes
# `mkdocs.yml` as-is, so the filename and every key below are unchanged. Build the site with
# `--strict`, which is what fails on a dangling `[`name`][ordito.old.path]` cross-reference.
#
# The API pages come from Zensical's native `api-autonav` (one page per public module, at
# `api/ordito/<module>/`); the nav, including the themed shelving of those pages, is the committed
# `docs/SUMMARY.md`. A plain `zensical build` / `serve` needs no pre-build step.
#
# No `exclude_docs:` here, though MkDocs had one for `assets/benchmarks/*.md` -- Zensical has no
# whole-file exclusion setting. Those sidecar tables carry `search: exclude: true` front matter
# instead (emitted by `benchmarks/plot_comparison.py`), which keeps them out of the search index;
# they are still built as unlinked pages, which nothing links to and the nav never shows.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  # `ordito` itself is excluded: its docstring is about the lazy-import mechanism, not a page for
  # a caller. Private `_*.py` modules are excluded by the plugin's default.
  - api-autonav:
      modules: [ordito]
      exclude: [ordito.kernels, "re:^ordito$"]
      api_root_uri: api
      # `ordito.typing`'s aliases are linked from every return annotation (85 referrers for
      # `Array2dInt32`), so a "Referenced by" block there lists signatures, not uses.
      module_options:
        "ordito\\.typing":
          backlinks: false
  - mkdocstrings:
      handlers:
        python:
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://docs.scipy.org/doc/scipy/objects.inv
            - https://trimesh.org/objects.inv
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_if_no_docstring: true
            members_order: source
            # "Referenced by": every docstring that cross-links an object, grouped by nav path.
            # It is the consumer list a hub function's See Also deliberately does not carry.
            backlinks: tree
