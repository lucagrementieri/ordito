[build-system]
build-backend = "setuptools.build_meta"
# PEP 639 license expression / license-files need setuptools >= 77.
requires = ["setuptools>=77", "wheel"]

[project]
authors = [
    { name = "Luca Grementieri", email = "luca.grementieri@ens-paris-saclay.fr" },
]
description = "Triangular mesh library based on NVIDIA Warp"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
name = "triwarp"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

# ``Operating System :: POSIX :: Linux`` is the *tested* claim, not a technical limit: the wheel is
# ``py3-none-any`` and warp-lang ships macOS and Windows builds, so triwarp very likely runs there.
# Nothing verifies it, and CI is Linux-only, so the classifier says what is checked rather than
# what is plausible. Widen it when a CI leg covers another platform.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
keywords = [
    "3d",
    "computational-geometry",
    "cuda",
    "geometry-processing",
    "gpu",
    "mesh",
    "triangle-mesh",
    "warp",
]

# ``triwarp.neighbors`` and ``triwarp.proximity`` are the package's hard 1.17 dependencies: their
# ball queries call ``wp.bvh_query_sphere``, which does not exist before it.

# ``numpy`` is core, not optional: 16 of the modules ``triwarp/__init__.py`` imports eagerly use it
# for host-side metadata math. It adds nothing to an install, since ``warp-lang`` itself declares an
# unconditional ``Requires-Dist: numpy`` and ``import warp`` loads it before triwarp gets a say.
dependencies = ["numpy>=1.20", "warp-lang>=1.17"]

[project.urls]
Documentation = "https://lucagrementieri.github.io/triwarp/"
Homepage = "https://lucagrementieri.github.io/triwarp/"
Issues = "https://github.com/lucagrementieri/triwarp/issues"
Repository = "https://github.com/lucagrementieri/triwarp"

[project.optional-dependencies]
io = ["meshio>=5.0"]

[dependency-groups]
# ``cairosvg`` and ``matplotlib`` are ``plot_comparison.py``'s only extras over the plain
# ``aggregate.py`` text tables: rasterizing a vendored SVG logo to a fixed-size PNG once
# (``benchmarks/assets/logos/render.py``) and drawing the comparison charts. Neither is a runtime
# dependency of triwarp itself.
bench = [
    "cairosvg>=2.7",
    "matplotlib>=3.9",
    "pytest-benchmark>=5.1",
    { include-group = "test" },
]
dev = ["basedpyright>=1.39", "ruff>=0.9", "scipy-stubs>=1.17.1.5"]
# Zensical is the builder; ``mkdocs.yml`` stays the config file, which it reads natively.
# ``mkdocs``, ``mkdocs-material``, ``mkdocs-literate-nav`` and ``mkdocs-section-index`` are all
# gone: Zensical implements the latter two itself -- measured, the built site is byte-identical
# with both packages uninstalled -- so the ``literate-nav`` and ``section-index`` entries left in
# ``mkdocs.yml``'s ``plugins:`` are read as configuration for Zensical's own implementations,
# not as a request to load a plugin. The same holds for ``api-autonav``, which generates the API
# pages natively from 0.0.66 on (hence the floor) and is not installed either.
docs = [
    "mkdocstrings[python]>=0.27",
    # Pre-1.0 and moving fast; the exact version is pinned in ``uv.lock``, as ``warp-lang`` is.
    "zensical>=0.0.66",
]
test = [
    "embreex>=4.4",
    "libigl>=2.6",
    "manifold3d>=2.3.0",
    "meshio>=5.3",
    "meshlib>=3.1.3.249",
    "moderngl>=5.10",
    "networkx>=3.0",
    "numpy>=2.4.4",
    "open3d>=0.18",
    # ``ninja`` is not optional: without it setuptools compiles pytorch3d's 36 .cpp + 31 .cu
    # sources one at a time. Measured on this box -- 10 m 55 s serial and CPU-only, against
    # **87 s** with ninja at MAX_JOBS=32 *including* the CUDA kernels.
    "ninja>=1.11",
    "potpourri3d>=1.4",
    "pymeshfix>=0.18.1",
    "pymeshlab>=2023.12",
    "pytest>=9.0",
    # Coverage is measured in CI only (`.github/workflows/test.yml`), so this is a test-group
    # dependency rather than a separate group: the CPU regression job already syncs `--all-groups`.
    "pytest-cov>=7.0",
    # The actual dependency declaration the rest of this block's comments assume exists --
    # ``[tool.uv.sources]`` below only overrides *where* a package named ``pytorch3d`` comes from,
    # it does not itself make anything depend on one. Without this line ``uv lock``/``uv sync``
    # never resolve or build pytorch3d at all: it can sit importable in a venv from a manual
    # ``uv pip install`` and still be entirely absent from ``uv.lock``, which is exactly the state
    # this project was in until this line was added. No version specifier -- the git source below
    # is the only version that exists.
    "pytorch3d",
    # Built from source (see ``[tool.uv.sources]``) rather than installed as a wheel
    "pyvista>=0.48",
    "rtree>=0.12",
    "scipy>=1.17",
    # pytorch3d's ``setup.py`` imports torch and needs setuptools, and it is built with
    # ``no-build-isolation`` (below), so both have to be resolvable in the target environment.
    "setuptools>=77",
    "shapely>=2.1.2",
    # pytorch3d declares no torch dependency although its extension links against it, so the
    # bound lives here, routed to the CUDA 12.8 index below. **The pin is exact on purpose.**
    # pytorch3d's ``_C`` is a torch C++ extension, so it is ABI-bound to the torch it was compiled
    # against, and uv keys its build cache on the git *commit* alone -- not on the build
    # environment.
    "py-cpuinfo>=9.0.0",
    "torch==2.11.0",
    "trimesh>=5.0.0",
]


# ---------------------------------------------------------------------------
# uv: how pytorch3d and its torch get installed
# ---------------------------------------------------------------------------
#
# pytorch3d has no usable Linux wheel, so it is compiled from the upstream tag. Three settings
# make that reproducible, and all three are load-bearing:
#
# 1. ``[tool.uv.sources] pytorch3d`` tracks upstream ``main``. That is *not* a floating install:
#    uv resolves the branch to a commit and records it in ``uv.lock``, so every ``uv sync`` builds
#    the same code until someone runs ``uv lock --upgrade-package pytorch3d``. There is no released
#    wheel worth using (see the note on the requirement above) and no PyPI release newer than
#    0.7.9, so tracking main is how this stays current; the cost is that advancing the pin pays the
#    87 s rebuild and lands untested upstream code, so advance it deliberately and re-run the
#    parity suite when you do. ``reference/pytorch3d`` is gitignored and absent from a fresh clone,
#    so a path source could not work in CI -- the git source is the only form that installs the
#    same code everywhere.
# 2. ``no-build-isolation-package`` is required because pytorch3d's ``setup.py`` imports torch at
#    build time to find its headers and to pick the CUDA / CPU extension. That makes the install
#    a two-step operation, because torch has to be present *before* pytorch3d is built:
#
#        uv sync --all-groups --no-install-package pytorch3d   # torch, ninja, setuptools
#        uv sync --all-groups                                  # builds pytorch3d against them
#
#    uv caches the built wheel against the resolved commit, so the second step measures **1 s**
#    on a warm cache -- cache ``~/.cache/uv`` in CI and the 87 s build is paid once.
# 3. torch comes from the CUDA 12.8 index, not from PyPI. PyPI's default torch 2.11 is a cu130
#    build, and torch's ``cpp_extension`` refuses to compile against a CUDA major it was not
#    built with (measured: ``nvcc`` 12.8 against a cu130 torch aborts the build), so a
#    PyPI-default torch silently costs the CUDA extension -- and with it the GPU-vs-GPU
#    comparison the benchmarks exist for. cu128 also carries ``sm_120``, which the RTX 5090
#    needs. On a box with a different toolkit, change the index to match its ``nvcc``.
[tool.uv]
no-build-isolation-package = ["pytorch3d"]

[[tool.uv.index]]
explicit = true
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[tool.uv.sources]
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", branch = "main" }
torch = { index = "pytorch-cu128" }

[tool.setuptools.packages.find]
exclude = ["reference*"]
include = ["triwarp*"]
where = ["."]

[tool.setuptools.package-data]
triwarp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]


# ---------------------------------------------------------------------------
# coverage.py
# ---------------------------------------------------------------------------
#
# ``triwarp/kernels/`` is omitted, and that is a measurement fact rather than a convenience.
# A ``@wp.kernel`` / ``@wp.func`` body is never *called* as Python: Warp's decorator parses the
# function's AST at import time, builds an ``Adjoint`` from it and generates C++, so the lines
# inside it execute on the device and never under ``sys.monitoring``. Measured on
# ``tests/test_edges.py`` -- the wrapper ``triwarp/edges.py`` reports 96 %, while
# ``triwarp/kernels/edges.py`` reports 35 % with every missing range being exactly a kernel body
# that ran on every one of the 53 tests. Over the whole CPU suite, in *line* coverage so the two
# halves are directly comparable, the split is 96.02 % for the wrapper layer against 24.29 % for
# ``kernels/``: including them would publish 59.40 %, a figure that measures nothing and invites
# exactly the wrong work. (The gate's own headline is lower, 93.79 %, because branch coverage is
# on below.) The same module tree is excluded from basedpyright (see ``[tool.basedpyright]``) and
# from the docs generator, for the adjacent reason that the kernel DSL is not ordinary Python.
#
# Branch coverage is on: the wrapper layer's own risk is concentrated in dispatch -- a ``method=``
# menu, a device branch, an empty-mesh early return -- and line coverage scores a taken-one-way
# ``if`` as fully covered.
[tool.coverage.run]
branch = true
# ``*.py:*`` is not a typo. ``warp._src.utils.map`` builds each generated kernel with ``exec`` and
# names the module after its call site -- ``context.py`` spells it ``f"{basename}:{lineno}"`` --
# so a ``wp.map`` site leaves a code object whose filename is ``triwarp/points.py:153``. Coverage
# tries to parse that as a path, fails, and emits one ``couldnt-parse`` warning per generated
# module: 72 of them over a full suite run, none contributing a line to the report. No real source
# file has a colon in its name, so this omits exactly the synthetic ones.
omit = ["*.py:*", "triwarp/kernels/*"]
source = ["triwarp"]

[tool.coverage.report]
# No ``exclude_also``, and that is measured rather than an omission. The two candidates a wrapper
# layer this type-heavy suggests both turn out to be handled already: coverage.py 7.16 excludes an
# ``if TYPE_CHECKING:`` block by itself (``analysis2`` reports 2 excluded lines in ``triwarp/io.py``
# with an empty config), and all 88 ``@overload`` stubs write ``...`` on the ``def`` line, which
# *does* execute at import -- there is not one bare ``...`` line under ``triwarp/``. Both patterns
# were tried and changed the statement count by exactly 0; a pattern that matches nothing is worse
# than no pattern, because it reads as a caveat someone has already handled.
#
# ``precision = 2`` so one figure serves all three consumers: the terminal report, the
# ``coverage report --fail-under`` gate, and ``percent_covered_display`` in the JSON report that
# the README badge is built from. An integer-rounded 94 % against a 93.79 % measurement would hide
# a point of drift in the gate and make the badge disagree with the log.
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "reference",
]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Core rules to enable
select = [
    "A",      # Builtins shadowing (Don't name a mesh variable 'id' or 'max')
    "B",      # Bugbear (Finds subtle, design-level bugs)
    "BLE",    # Blind-except (No generic 'except:')
    "D",      # Pydocstyle (Enforces docstrings for complex geometry algorithms)
    "E",
    "F",      # Pyflakes (Severe syntax/runtime errors)
    "I",      # Isort (Clean, sorted imports)
    "ICN",    # Import conventions (Forces 'import numpy as np')
    "N",      # Pep8-naming (Mathematical & PEP8 naming conventions)
    "PT",     # Pytest-style (Clean testing framework)
    "RUF",    # Ruff-specific internal rules
    "TID251", # Banned APIs (see flake8-tidy-imports.banned-api below)
    "UP",     # Pyupgrade (Keeps syntax modern and performant)
    "W",      # Pycodestyle (Standard PEP 8 formatting)
    "YTT",    # Sys.version checks (Prevents compatibility bugs)
]

ignore = [
    "D100", # Missing docstring in __init__
    "D103", # Missing docstring in public package
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method (e.g., __str__ usually doesn't need one)
    "D203", # Conflict fix: Prefer D211 (no blank line before class)
    "D212", # Conflict fix: Prefer D213 (summary on second line)
    "D413", # Missing blank line after last section
]

[tool.ruff.lint.per-file-ignores]
"triwarp/reduce.py" = ["A001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Tests patch and assert through pytest alone (CLAUDE.md section 7.1): ``monkeypatch`` restores what
# it patched at teardown, and ``monkeypatch.context()`` scopes a patch to a block.
"unittest".msg = "use pytest: the monkeypatch fixture (monkeypatch.context() for a scoped patch)"

[tool.ruff.lint.isort]
known-first-party = ["triwarp"]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-import-conventions.aliases]
"meshlib.mrmeshnumpy" = "mn"
"meshlib.mrmeshpy" = "mm"
numpy = "np"
open3d = "o3d"
"pytorch3d.loss" = "p3d_loss"
"pytorch3d.ops" = "p3d_ops"
"pytorch3d.structures" = "p3d_structures"
pyvista = "pv"
trimesh = "tm"
warp = "wp"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.basedpyright]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "reference",
    "site",
    # Warp's kernel DSL (wp.array[wp.vec3] subscripting, wp.tid(), typed vector
    # constructors, kernel-scope slicing) is not modeled by any type stubs, so
    # triwarp/kernels/ is inherently un-typecheckable. Excluded wholesale.
    "triwarp/kernels",
]
include = ["benchmarks", "tests", "triwarp"]
pythonVersion = "3.11"
# Test-only stubs for reference libraries that ship none a checker can read (pymeshlab).
stubPath = "tests/typings"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

# ``strict``, less the ``reportUnknown*`` family. Warp's Python-scope stubs leave most of
# ``wp.array`` untyped (``.device``, ``.shape``, ``.numpy()``, slicing), so every expression over an
# array is partially ``Unknown``.
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedParameter = "error"

[[tool.basedpyright.executionEnvironments]]
extraPaths = ["."]
reportMissingTypeStubs = "none"
root = "tests"

[[tool.basedpyright.executionEnvironments]]
extraPaths = ["."]
reportMissingTypeStubs = "none"
root = "benchmarks"

[[tool.basedpyright.executionEnvironments]]
root = "."
